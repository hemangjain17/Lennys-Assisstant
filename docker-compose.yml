version: "3.8"

services:
  # ── OLLAMA LOCAL SERVICE ──
  ollama:
    image: ollama/ollama:latest
    container_name: lenny-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    # Pull the required model automatically on startup
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull llama3.1 &&
      wait
      "
    restart: unless-stopped

  # ── FASTAPI BACKEND SERVICE ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lenny-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - OLLAMA_LOCAL_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  # ── NEXT.JS FRONTEND SERVICE ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lenny-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_storage:
